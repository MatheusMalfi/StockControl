<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Início — Impact Metais | StockControl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Variáveis de cor do projeto ── */
    :root {
      --bg:        #0a0f1e;
      --card-bg:   #0d1f1f;
      --card-alt:  #112222;
      --cyan:      #00e5c8;
      --white:     #ffffff;
      --badge-red: #cc0000;
      --input-bg:  #162e2e;
      --border:    #1e3a3a;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 36px 24px 28px;
      background: var(--bg);
    }
    .header-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--white);
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .header-sub {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* ── Container principal ── */
    .container {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px 32px;
    }

    /* ── Grid de duas colunas ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    @media (max-width: 600px) {
      .two-col { grid-template-columns: 1fr; }
    }

    /* ── Título de seção ── */
    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ── Card de reciclador ── */
    .recycler-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .recycler-card:last-child { margin-bottom: 0; }
    .recycler-card:hover { background: var(--card-alt); }

    /* Placeholder circular de logo */
    .logo-placeholder {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--white);
      flex-shrink: 0;
    }
    .logo-impact  { background: #1a5c4e; }
    .logo-recicla { background: #1a4d3a; }
    .logo-metal   { background: #1a3d5c; }

    .recycler-name {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--white);
    }

    /* Badge vermelho de pedidos pendentes */
    .badge {
      background: var(--badge-red);
      color: var(--white);
      font-size: 0.75rem;
      font-weight: 700;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── Card de PDF do histórico ── */
    .pdf-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .pdf-card:hover { background: var(--card-alt); }

    /* Ícone PDF simulado */
    .pdf-icon {
      background: #cc0000;
      color: var(--white);
      font-size: 0.65rem;
      font-weight: 900;
      width: 36px;
      height: 44px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      position: relative;
    }
    .pdf-icon::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 10px;
      height: 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 0 6px 0 6px;
    }

    .pdf-label {
      flex: 1;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--white);
    }

    /* Link "VER MAIS" */
    .ver-mais {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .ver-mais:hover { opacity: 0.75; }

    /* ── Coluna interna ── */
    .col-panel {
      background: var(--card-alt);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-title">StockControl</div>
    <div class="header-sub">Controle de Estoque</div>
  </header>

  <!-- Container principal -->
  <main class="container">

    <!-- Grid de duas colunas -->
    <div class="two-col">

      <!-- Coluna esquerda: lista de recicladores -->
      <div class="col-panel">
        <div class="section-title">Recicladores Parceiros</div>

        <!-- Impact Metais -->
        <a href="tela2-lista-pedidos.html" style="text-decoration:none">
          <div class="recycler-card">
            <div class="logo-placeholder logo-impact">I</div>
            <span class="recycler-name">Impact Metais</span>
            <div class="badge">3</div>
          </div>
        </a>

        <!-- ReciclaFer -->
        <div class="recycler-card">
          <div class="logo-placeholder logo-recicla">R</div>
          <span class="recycler-name">ReciclaFer</span>
          <div class="badge">2</div>
        </div>

        <!-- MetalVerde -->
        <div class="recycler-card">
          <div class="logo-placeholder logo-metal">M</div>
          <span class="recycler-name">MetalVerde</span>
          <div class="badge">1</div>
        </div>

      </div>

      <!-- Coluna direita: histórico de coleta PDF -->
      <div class="col-panel">
        <div class="section-title">Histórico de Coleta</div>

        <!-- PDF 2024 -->
        <div class="pdf-card">
          <div class="pdf-icon">PDF</div>
          <span class="pdf-label">Histórico de Coleta 2024</span>
        </div>

        <!-- PDF 2023 -->
        <div class="pdf-card">
          <div class="pdf-icon">PDF</div>
          <span class="pdf-label">Histórico de Coleta 2023</span>
        </div>

        <!-- PDF 2022 -->
        <div class="pdf-card">
          <div class="pdf-icon">PDF</div>
          <span class="pdf-label">Histórico de Coleta 2022</span>
        </div>

        <a href="#" class="ver-mais">Ver Mais</a>
      </div>

    </div>
  </main>

</body>
</html>
