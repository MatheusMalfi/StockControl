<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Home StockControl</title>

    <link rel="stylesheet" href="/navigation-screens/home/home.css" />
  </head>

  <body>
    <header class="header">
      <h1>StockControl</h1>

      <h2>CONTROLE DE ESTOQUE</h2>
    </header>

    <div class="sub-menu">
    <div class="sub-menu-left">
        <button
            class="menu-btn logout-btn"
            data-tooltip="Sair"
            onclick="window.location.href='/acesso/login/login.html'"
        >
            <img
                src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/box-arrow-left.svg"
                alt="Sair"
            />
        </button>
    </div>

    <div class="sub-menu-right">
        <button
            class="menu-btn"
            data-tooltip="Cadastrar Item"
            onclick="window.location.href='/navigation-screens/register-item/register-item.html'"
        >
            <img
                src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/plus.svg"
                alt="Cadastrar Item"
            />
        </button>
        <button
            class="menu-btn"
            data-tooltip="Aguardando Coleta"
            onclick="window.location.href='/navigation-screens/awaiting-collection/awaiting-collection.html'"
        >
            <img
                src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/arrow-clockwise.svg"
                alt="Aguardando Coleta"
            />
        </button>

        <button
            class="menu-btn"
            data-tooltip="Descartar Item"
            onclick="window.location.href='/navigation-screens/discard-item/discard-item.html'"
        >
            <img
                src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/trash.svg"
                alt="Descartar Item"
            />
        </button>

        <!-- NOVO BOTÃO: HISTÓRICO DE COLETAS -->
        <!-- <button class="menu-btn" data-tooltip="Histórico de Descartes"
            onclick="window.location.href='/navigation-screens/collection-history/collection-history.html'">
            <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/clock-history.svg" alt="Histórico de Descartes"/>
        </button> -->
    </div>
</div>

    <div class="dashboard-container">
      
      <div class="dashboard">
        <section class="card registered-items" onclick="activateScroll('registered-items')">
          <h2>Itens Cadastrados</h2>
           <div id="registered-items-content" class="item-list scrollable-content"></div> 
        </section>

       <section class="card awaiting-collection" onclick="activateScroll('awaiting-collection')">
          <h2>Itens Aguardando a Coleta</h2>
          <div id="awaiting-collection-content" class="scrollable-content"></div>
        </section>

        <section class="card discard-history" onclick="activateScroll('discard-history')">
          <h2>Histórico de Descarte</h2>
         <div id="discard-history-content" class="discard-scroll-content"></div>
        </section>
      </div>
    </div>
    <script src="/navigation-screens/home/home.js"></script>
</body>
</html>

  </body>
</html>
