<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="/navigation-screens/awaiting-collection/awaiting-collection.css"
    />
    <link rel="stylesheet" href="/styles.css" />

    <title>Aguardando Coleta StockControl</title>
  </head>
  <body>
    <header class="header">
      <h1>
        <a
          href="/navigation-screens/home/home.html"
          target="_blank"
          style="text-decoration: none; color: inherit"
          >StockControl</a
        >
      </h1>
      <h2>CONTROLE DE ESTOQUE</h2>
    </header>

    <div class="content-wrapper">
      <div class="sub-menu">
        <button
          class="menu-btn"
          data-tooltip="Voltar para Home"
          onclick="window.location.href = '/navigation-screens/home/home.html'"
        >
          <img
            src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/house.svg"
            alt="Home"
          />
        </button>
      </div>
    </div>

    <main>
      <div class="card">
        <h3>Aguardando Coleta</h3>
        <p>Selecione o item a ser visualizado.</p>

        <div class="items" id="itemsContainer"></div>

        <div class="btn-action">
          <button disabled>VISUALIZAR</button>
        </div>
      </div>
    </main>

    <!-- Modal de Visualização/Edição -->
    <div id="itemModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Detalhes do Item</h3>
          <div class="modal-actions">
            <button class="edit-btn" id="editBtn" title="Editar item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="currentColor"
                viewBox="0 0 16 16"
              >
                <path
                  d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"
                />
              </svg>
            </button>
            <button class="close-btn" id="closeModal">&times;</button>
          </div>
        </div>

        <form id="modalForm">
          <div class="modal-body">
            <div class="form-group">
              <label>Foto do Produto</label>
              <div class="photo-container">
                <div class="photo-preview">
                  <img id="modalPhoto" src="" alt="Foto do produto" />
                </div>
                <button
                  type="button"
                  class="photo-upload-btn"
                  id="photoUploadBtn"
                >
                  Trocar Foto
                </button>
              </div>
              <input
                type="file"
                id="photoInput"
                class="photo-input-file"
                accept="image/*"
              />
            </div>

            <div class="form-group">
              <label for="modalProduto">Nome do Produto</label>
              <input type="text" id="modalProduto" readonly />
            </div>

            <div class="form-group">
              <label for="modalMarca">Marca</label>
              <input type="text" id="modalMarca" readonly />
            </div>

            <div class="form-group">
              <label for="modalModelo">Modelo</label>
              <input type="text" id="modalModelo" readonly />
            </div>

            <div class="form-group">
              <label for="modalDescricao">Descrição</label>
              <textarea id="modalDescricao" readonly rows="4"></textarea>
            </div>

            <div class="form-group">
              <label>Condição</label>
              <div class="status-options">
                <label class="status-option green-opt">
                  <input
                    type="radio"
                    name="modalStatus"
                    value="OTIMO"
                    disabled
                  />
                  <span class="dot green"></span> Ótimo Estado de Uso
                </label>
                <label class="status-option yellow-opt">
                  <input
                    type="radio"
                    name="modalStatus"
                    value="REPARO"
                    disabled
                  />
                  <span class="dot yellow"></span> Necessita de Reparos
                </label>
                <label class="status-option red-opt">
                  <input
                    type="radio"
                    name="modalStatus"
                    value="DESCARTAR"
                    disabled
                  />
                  <span class="dot red"></span> Necessita ser Descartado
                </label>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn-cancel" id="cancelBtn">
              Fechar
            </button>
            <button
              type="submit"
              class="btn-confirmation"
              id="saveBtn"
              style="display: none"
            >
              Salvar Alterações
            </button>
          </div>
        </form>
      </div>
    </div>

    <script
      src="/navigation-screens/awaiting-collection/awaiting-collection.js"
      defer
    ></script>
  </body>
</html>
