<!-- Modal de confirmação de exclusão de movimentação, inspirado no modal de descarte do estoque -->
<div class="modal-backdrop" id="deleteMovModal">
  <div class="modal modal-sm modal-confirm">
    <div class="modal-header">
      <h3 class="modal-title">Confirmar Exclusão</h3>
      <button class="modal-close" data-close-modal="deleteMovModal">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="modal-confirm-icon danger">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
        </svg>
      </div>
      <p class="modal-confirm-title">Excluir movimentação?</p>
      <p class="modal-confirm-desc" id="deleteMovDesc">
        Esta ação removerá a movimentação e não pode ser desfeita.
      </p>
      <div
        class="form-group"
        style="margin-top: var(--space-3); text-align: left"
      >
        <label class="form-label" for="deleteMovNotes"
          >Observações (Opcional)</label
        >
        <textarea
          class="form-control"
          id="deleteMovNotes"
          rows="2"
          placeholder="Digite a observação…"
        ></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close-modal="deleteMovModal">
        Cancelar
      </button>
      <button class="btn btn-danger" id="deleteMovConfirmBtn">Excluir</button>
    </div>
  </div>
</div>
