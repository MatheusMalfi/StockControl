<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function () {
        try {
          var rawUser =
            localStorage.getItem("sc_user") ||
            sessionStorage.getItem("sc_user");
          var theme = "light";

          if (rawUser) {
            var user = JSON.parse(rawUser);
            var orgId = user && user.organization_id;

            if (orgId) {
              var rawPrefs = localStorage.getItem("sc_preferencias_" + orgId);

              if (rawPrefs) {
                theme = JSON.parse(rawPrefs).tema || theme;
              }
            }
          }

          if (theme === "auto") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "escuro"
              : "claro";
          }

          document.documentElement.setAttribute(
            "data-theme",
            theme === "escuro" ? "dark" : "light",
          );
          document.documentElement.style.backgroundColor =
            theme === "escuro" ? "#0f172a" : "#f8fafc";
          document.documentElement.style.color =
            theme === "escuro" ? "#f8fafc" : "#1e293b";
        } catch (error) {}
      })();
    </script>

    <title>Detalhe do Pedido — StockControl</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/components.css" />

    <style>
      .detail-layout {
        display: flex;
        flex-direction: column;
        gap: var(--space-5);
      }

      .order-hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
        flex-wrap: wrap;
      }

      .recycler-info {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        min-width: 0;
      }

      .recycler-avatar {
        width: 48px;
        height: 48px;
        border-radius: var(--radius-full);
        background: var(--color-primary-light);
        color: var(--color-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.125rem;
        flex-shrink: 0;
      }

      .recycler-name {
        font-size: 1rem;
        font-weight: 600;
        color: var(--color-text-primary);
        line-height: 1.3;
      }

      .recycler-subtitle {
        font-size: 0.8125rem;
        color: var(--color-text-muted);
        margin-top: 2px;
      }

      .order-code {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: var(--space-1);
      }

      .order-code-label {
        font-size: 0.75rem;
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .order-code-value {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--color-text-primary);
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-3);
      }

      .summary-item {
        padding: var(--space-4);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        background: var(--color-surface-alt);
      }

      .summary-label {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: var(--space-1);
      }

      .summary-value {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--color-text-primary);
        line-height: 1.2;
      }

      .summary-helper {
        font-size: 0.8125rem;
        color: var(--color-text-secondary);
        margin-top: var(--space-1);
      }

      .product-cell {
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }

      .product-icon {
        width: 34px;
        height: 34px;
        border-radius: var(--radius-full);
        background: var(--color-primary-light);
        color: var(--color-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        flex-shrink: 0;
      }

      .product-title {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--color-text-primary);
        line-height: 1.3;
      }

      .product-description {
        font-size: 0.8125rem;
        color: var(--color-text-muted);
        margin-top: 2px;
      }

      .detail-actions {
        display: flex;
        justify-content: flex-end;
        gap: var(--space-2);
        flex-wrap: wrap;
        margin-top: var(--space-4);
      }

      @media (max-width: 768px) {
        .summary-grid {
          grid-template-columns: 1fr;
        }

        .order-hero {
          align-items: flex-start;
        }

        .order-code {
          align-items: flex-start;
        }

        .detail-actions {
          justify-content: stretch;
        }

        .detail-actions .btn {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title" id="pageTitle">Detalhe do Pedido</h1>
          <p class="page-subtitle" id="pageSubtitle">
            Visualize as informações completas do pedido selecionado
          </p>
        </div>

        <div style="display: flex; gap: var(--space-2); flex-wrap: wrap">
          <button
            class="btn btn-secondary"
            onclick="
              window.location.href = '/recicladora/pedidos-recicladora.html'
            "
            type="button"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Voltar
          </button>

          <button
            class="btn btn-primary"
            id="scheduleBtn"
            type="button"
            style="display: none"
          >
            Agendar Coleta
          </button>
        </div>
      </div>

      <div class="detail-layout">
        <div class="card">
          <div class="card-body">
            <div class="order-hero">
              <div class="recycler-info">
                <div class="recycler-avatar" id="orgInitial">?</div>
                <div>
                  <div class="recycler-name" id="orgName">-</div>
                  <div class="recycler-subtitle" id="orgMeta">
                    Carregando...
                  </div>
                </div>
              </div>

              <div class="order-code">
                <span class="order-code-label">Pedido</span>
                <span class="order-code-value" id="orderCode">-</span>
              </div>
            </div>
          </div>
        </div>

        <div class="summary-grid">
          <div class="summary-item">
            <div class="summary-label">Produtos</div>
            <div class="summary-value" id="productsCount">0</div>
            <div class="summary-helper">tipos cadastrados</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">Valor total</div>
            <div class="summary-value" id="totalValue">-</div>
            <div class="summary-helper" id="valueCurrency">estimado</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Descrição do Pedido</h2>
            <span class="badge badge-primary" id="statusBadge">-</span>
          </div>

          <div class="table-wrapper" style="border: none; border-radius: 0">
            <table class="table">
              <thead>
                <tr>
                  <th>Produto</th>
                  <th>Localização</th>
                  <th>Peso</th>
                  <th>Valor Estimado</th>
                  <th>Quantidade</th>
                </tr>
              </thead>
              <tbody id="itemsTableBody"></tbody>
            </table>
          </div>

          <div class="card-body">
            <div class="detail-actions">
              <button
                class="btn btn-secondary"
                onclick="window.location.href = '/recicladora/recicladora.html'"
                type="button"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 9.5L12 3l9 6.5" />
                  <path d="M5 10v10h14V10" />
                </svg>
                Início
              </button>

              <button
                class="btn btn-primary"
                id="scheduleBtn2"
                type="button"
                style="display: none"
              >
                Agendar Coleta
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/layout.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js-recicladoras/detalhes-pedido.js"></script>
  </body>
</html>
