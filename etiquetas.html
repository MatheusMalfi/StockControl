<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etiquetas — StockControl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="styles/etiquetas.css" />
</head>
<body>

  <!-- ── SIDEBAR ──────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>

    <div class="sidebar-divider"></div>

    <a href="index.html" class="sidebar-nav-link" title="Dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    </a>
    <a href="estoque.html" class="sidebar-nav-link" title="Estoque">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </a>
    <a href="movimentacoes.html" class="sidebar-nav-link" title="Movimentações">
      <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </a>
    <a href="solicitacoes.html" class="sidebar-nav-link" title="Solicitações">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    </a>
    <a href="relatorios.html" class="sidebar-nav-link" title="Relatórios">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    </a>
    <a href="notificacoes.html" class="sidebar-nav-link" title="Notificações">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </a>

    <div class="sidebar-divider"></div>

    <a href="form-item.html" class="sidebar-nav-link" title="Novo Item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    </a>
    <a href="parceiros.html" class="sidebar-nav-link" title="Parceiros">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </a>
    <a href="etiquetas.html" class="sidebar-nav-link ativo" title="Etiquetas">
      <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
    </a>
    <a href="configuracoes.html" class="sidebar-nav-link" title="Configurações">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
    </a>

    <!-- User avatar — main.js writes initials here -->
    <div class="sidebar-user-avatar" id="sidebarInitials" title="">U</div>
    <!-- Hidden spans for main.js compatibility -->
    <span id="sidebarUserName" hidden></span>
    <span id="sidebarUserRole" hidden></span>
  </aside>

  <!-- ── MAIN ─────────────────────────────────────────── -->
  <div class="main-wrapper">

    <header class="header">
      <!-- hidden button satisfies main.js headerMenuBtn lookup -->
      <button id="headerMenuBtn" hidden aria-hidden="true"></button>

      <div class="header-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="globalSearch" placeholder="Buscar…" aria-label="Busca global" />
      </div>

      <div class="header-actions">
        <!-- Notifications -->
        <div style="position:relative">
          <button class="icon-btn-hdr" id="notifBtn" aria-label="Notificações">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-dot" id="notifBadge" style="display:none"></span>
          </button>
          <div class="notif-drop" id="notifListDrop" style="display:none"></div>
        </div>

        <!-- User chip -->
        <div class="user-chip">
          <div class="user-chip-avatar" id="headerAvatar">U</div>
          <span class="user-chip-name" id="headerUserName"></span>
        </div>

        <button class="btn-logout" id="logoutBtn">Sair</button>
      </div>
    </header>

    <div class="conteudo">
      <div class="page-header">
        <h1>Gerador de Etiquetas</h1>
        <p>Selecione itens e imprima etiquetas patrimoniais com QR Code</p>
      </div>

      <div class="layout-etiquetas">

        <!-- ── PAINEL ESQUERDO: lista de itens ─────────── -->
        <div class="painel-lista">

          <div class="filtros-lista">
            <div class="busca-wrapper">
              <span class="icone-busca" aria-hidden="true">🔍</span>
              <input type="text" id="buscaItens"
                     placeholder="Buscar por nome ou patrimônio…"
                     autocomplete="off" />
              <button class="btn-limpar-busca" id="btnLimparBusca"
                      title="Limpar busca" aria-label="Limpar busca">×</button>
            </div>
            <select id="filtroCategoria" aria-label="Filtrar por categoria">
              <option value="">Todas as categorias</option>
            </select>
          </div>

          <div class="header-selecao">
            <label class="checkbox-wrapper" for="checkboxTodos">
              <input type="checkbox" id="checkboxTodos" />
              <span>Selecionar todos</span>
            </label>
            <span class="contador-selecionados" id="contadorSelecionados">0 selecionados</span>
          </div>

          <div class="lista-itens" id="listaItens">
            <!-- skeleton inicial -->
            <div class="skeleton-linha">
              <div class="skeleton-box sk-check"></div>
              <div class="skeleton-box sk-icone"></div>
              <div class="sk-info"><div class="skeleton-box sk-nome"></div><div class="skeleton-box sk-meta"></div></div>
              <div class="skeleton-box sk-pat"></div>
            </div>
            <div class="skeleton-linha">
              <div class="skeleton-box sk-check"></div>
              <div class="skeleton-box sk-icone"></div>
              <div class="sk-info"><div class="skeleton-box sk-nome" style="width:45%"></div><div class="skeleton-box sk-meta" style="width:30%"></div></div>
              <div class="skeleton-box sk-pat"></div>
            </div>
            <div class="skeleton-linha">
              <div class="skeleton-box sk-check"></div>
              <div class="skeleton-box sk-icone"></div>
              <div class="sk-info"><div class="skeleton-box sk-nome" style="width:70%"></div><div class="skeleton-box sk-meta" style="width:50%"></div></div>
              <div class="skeleton-box sk-pat"></div>
            </div>
          </div>

          <div class="rodape-lista">
            <span id="infoTotal">Carregando…</span>
            <button class="btn-limpar-sel" onclick="limparSelecao()">Limpar seleção</button>
          </div>
        </div>

        <!-- ── PAINEL DIREITO: configurações + preview ── -->
        <div class="painel-config">

          <!-- Tamanho + campos -->
          <div class="secao-config">
            <h3>⚙ Configurações</h3>

            <div class="tamanhos-wrapper">
              <div class="card-tamanho ativo" data-tamanho="pequena" onclick="setTamanho(this.dataset.tamanho)">
                <div class="icone-tamanho pequena"></div>
                <span class="nome-tamanho">Pequena</span>
                <span class="dims-tamanho">40×20mm</span>
              </div>
              <div class="card-tamanho" data-tamanho="media" onclick="setTamanho(this.dataset.tamanho)">
                <div class="icone-tamanho media"></div>
                <span class="nome-tamanho">Média</span>
                <span class="dims-tamanho">60×30mm</span>
              </div>
              <div class="card-tamanho" data-tamanho="grande" onclick="setTamanho(this.dataset.tamanho)">
                <div class="icone-tamanho grande"></div>
                <span class="nome-tamanho">Grande</span>
                <span class="dims-tamanho">80×40mm</span>
              </div>
            </div>

            <div class="campos-config">
              <h4>Campos visíveis</h4>
              <label class="campo-toggle">
                <input type="checkbox" data-campo="patrimonio" onchange="setCampo(this.dataset.campo, this.checked)" checked /> Patrimônio
              </label>
              <label class="campo-toggle">
                <input type="checkbox" data-campo="condicao"   onchange="setCampo(this.dataset.campo, this.checked)" checked /> Condição
              </label>
              <label class="campo-toggle">
                <input type="checkbox" data-campo="quantidade" onchange="setCampo(this.dataset.campo, this.checked)" checked /> Quantidade
              </label>
              <label class="campo-toggle">
                <input type="checkbox" data-campo="organizacao" onchange="setCampo(this.dataset.campo, this.checked)" checked /> Organização
              </label>
              <label class="campo-toggle">
                <input type="checkbox" data-campo="categoria"  onchange="setCampo(this.dataset.campo, this.checked)" /> Categoria
              </label>
              <label class="campo-toggle">
                <input type="checkbox" data-campo="serie"      onchange="setCampo(this.dataset.campo, this.checked)" /> Série / Modelo
              </label>
            </div>
          </div>

          <!-- Preview -->
          <div class="secao-preview">
            <h4>🏷 Pré-visualização</h4>
            <div class="area-preview" id="areaPreview">
              <div class="preview-vazio">
                <div class="icone-preview">🏷️</div>
                <p>Selecione itens para visualizar</p>
              </div>
            </div>
          </div>

          <!-- Ação -->
          <div class="botoes-acao">
            <button class="btn-imprimir" id="btnImprimir" disabled onclick="imprimir()">
              🖨️ Imprimir (<span id="contadorImpressao">0</span>)
            </button>
            <button class="btn-pdf" id="btnPdf" disabled onclick="exportarPDF()">
              📄 Exportar PDF
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- ── ÁREA DE IMPRESSÃO (oculta na tela, visível no print) ── -->
  <div class="area-impressao" id="areaImpressao">
    <div class="grid-impressao" id="gridImpressao"></div>
  </div>

  <!-- ── TOASTS ─────────────────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="js/etiquetas.js"></script>
</body>
</html>
