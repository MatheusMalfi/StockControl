<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - StockControl</title>
    <link rel="stylesheet" href="change-password.css">
</head>

<body>

    <h1 id="titulo_principal">StockControl</h1>
    <h2 id="subtitulo">CONTROLE DE ESTOQUE</h2>

    <main>

        <div class="painel-externo">

            <div class="painel-interno">

                <h3 class="titulo">ALTERAR SENHA</h3>

                <form class="form-recuperar" onsubmit="return alterarSenha()">

                    <input type="password" id="senha" placeholder="Nova Senha" required>
                    <input type="password" id="confirmar_senha" placeholder="Confirme a Senha" required>

                    <div class="botoes">

                        <a href="Login.html">
                            <button type="button">VOLTAR</button>
                        </a>

                        <!-- ENVIAR vem depois -->
                        <button type="submit">ENVIAR</button>

                    </div>

                </form> 

            </div>

        </div>

    </main>

   <script src="change-password.js"></script>

</body>
</html>
